<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Góry & Siła</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBg: '#0b1120',
            cardBg: '#131d31',
            cardBorder: '#1c2b44',
            accent: '#059669',
            accentLight: '#34d399'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-appBg text-slate-100 min-h-screen font-sans antialiased pb-12">

  <!-- EKRAN LOGOWANIA / REJESTRACJI -->
  <div id="auth-screen" class="max-w-md mx-auto px-4 pt-20 hidden">
    <div class="bg-cardBg p-8 rounded-2xl border border-cardBorder shadow-xl space-y-6">
      <div class="text-center">
        <h1 class="text-2xl font-bold text-white">Góry & Siła</h1>
        <p class="text-xs text-slate-400 mt-1">Zaloguj się, aby zarządzać treningami</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 font-semibold block mb-1">E-mail</label>
          <input type="email" id="auth-email" class="w-full bg-appBg border border-cardBorder rounded-xl p-3 text-sm text-white focus:outline-none focus:border-accent">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-semibold block mb-1">Hasło</label>
          <input type="password" id="auth-password" class="w-full bg-appBg border border-cardBorder rounded-xl p-3 text-sm text-white focus:outline-none focus:border-accent">
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="handleLogin()" class="flex-1 py-3 bg-accent hover:bg-emerald-600 text-white font-bold text-xs rounded-xl transition">Zaloguj</button>
        <button onclick="handleRegister()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl border border-cardBorder transition">Zarejestruj</button>
      </div>
    </div>
  </div>

  <!-- GŁÓWNA APLIKACJA -->
  <div id="app-screen" class="max-w-4xl mx-auto px-4 py-6 hidden">
    <div class="flex justify-between items-center mb-4 px-2">
      <span id="user-email-display" class="text-xs text-slate-400"></span>
      <button onclick="handleLogout()" class="text-xs text-red-400 hover:underline font-semibold">Wyloguj się</button>
    </div>

    <div class="relative overflow-hidden rounded-2xl border border-cardBorder bg-cardBg mb-6 shadow-xl">
      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80" alt="Góry & Siła Banner" class="w-full h-40 object-cover object-center opacity-30">
      <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-cardBg/60 to-transparent flex items-end p-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between w-full gap-4">
          <div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Góry & Siła</h1>
            <p class="text-xs text-slate-400 font-medium">System Treningowy & Przygotowanie w Góry</p>
          </div>
        </div>
      </div>
    </div>

    <nav class="flex flex-wrap bg-cardBg p-1.5 rounded-xl border border-cardBorder text-xs sm:text-sm font-semibold mb-6 gap-1">
      <button onclick="switchTab('flow')" id="tab-btn-flow" class="tab-btn flex-1 min-w-[110px] py-2.5 rounded-lg transition-all bg-accent text-white shadow-md">Trening</button>
      <button onclick="switchTab('plan')" id="tab-btn-plan" class="tab-btn flex-1 min-w-[110px] py-2.5 rounded-lg transition-all text-slate-400 hover:text-white">Grafik Miesięcy</button>
      <button onclick="switchTab('history')" id="tab-btn-history" class="tab-btn flex-1 min-w-[110px] py-2.5 rounded-lg transition-all text-slate-400 hover:text-white">Historia</button>
    </nav>

    <main id="tab-flow" class="tab-content space-y-6">
      <section class="bg-cardBg p-5 rounded-2xl border border-cardBorder">
        <h2 id="current-discipline-title" class="text-xl font-bold text-white mb-4">Siłownia</h2>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2" id="discipline-selector"></div>
      </section>

      <div class="bg-cardBg p-4 rounded-2xl border border-cardBorder flex items-center justify-between">
        <div>
          <span class="text-xs text-slate-400 font-medium block uppercase tracking-wider">Objętość Sesji</span>
          <span id="total-tonnage" class="text-2xl font-bold text-amber-400">0 kg</span>
        </div>
        <div class="text-right">
          <span class="text-xs text-slate-400 font-medium block">Serie Wykonane</span>
          <span id="completed-sets-count" class="text-lg font-bold text-slate-200">0</span>
        </div>
      </div>

      <section class="space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-white">Ćwiczenia</h3>
        </div>
        <div id="workout-exercise-list" class="space-y-4"></div>
      </section>

      <button onclick="finishWorkout()" class="w-full py-4 bg-accent hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg transition">Zakończ i Zapisz Trening</button>
    </main>

    <main id="tab-plan" class="tab-content hidden space-y-6">
      <div class="bg-cardBg p-6 rounded-2xl border border-cardBorder space-y-4">
        <h2 class="text-lg font-bold text-white">Grafik Miesięcy</h2>
        <div id="monthly-plan-list" class="space-y-2.5 pt-2"></div>
      </div>
    </main>

    <main id="tab-history" class="tab-content hidden space-y-6">
      <div class="bg-cardBg p-6 rounded-2xl border border-cardBorder space-y-4">
        <h2 class="text-lg font-bold text-white">Historia i Statystyki</h2>
        <div id="history-list" class="space-y-3"></div>
      </div>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBXlf-31p9tZcxPNI6ygIgEpVgAJbV32lE",
      authDomain: "gory-sila.firebaseapp.com",
      projectId: "gory-sila",
      storageBucket: "gory-sila.firebasestorage.app",
      messagingSenderId: "193068071570",
      appId: "1:193068071570:web:6cce67aaaf25d3066b044b",
      measurementId: "G-C0P43V04TE"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const DISCIPLINES = [
      { id: 'silownia', name: 'Siłownia' },
      { id: 'kettlebell', name: 'Kettlebell' },
      { id: 'kalistenika', name: 'Kalistenika' },
      { id: 'bieganie', name: 'Bieganie' },
      { id: 'gory', name: 'Góry (Wyjazd)' },
      { id: 'wolne', name: 'Wolne / Regen' }
    ];

    const DEFAULT_TEMPLATES = {
      silownia: [{ name: 'Przysiad ze sztangą', sets: [{ reps: 8, weight: 80, done: false }] }],
      kettlebell: [{ name: 'Kettlebell Swing', sets: [{ reps: 20, weight: 16, done: false }] }],
      kalistenika: [{ name: 'Podciąganie', sets: [{ reps: 8, weight: 0, done: false }] }],
      bieganie: [{ name: 'Bieg spokojny', sets: [{ time: 40, calories: 350, done: false }] }],
      gory: [{ name: 'Marsz z plecakiem', sets: [{ time: 90, calories: 750, done: false }] }],
      wolne: [{ name: 'Rozciąganie', sets: [{ reps: 10, weight: 0, done: false }] }]
    };

    const DEFAULT_MONTHLY_PLAN = [
      { month: 'październik', target: '8x3' },
      { month: 'listopad', target: '9x3' },
      { month: 'grudzień', target: '10x3' },
      { month: 'styczeń', target: '11x3' },
      { month: 'luty', target: '12x3' },
      { month: 'marzec', target: '13x3' },
      { month: 'kwiecień', target: '14x3' },
      { month: 'maj', target: '15x3' },
      { month: 'czerwiec', target: '7x4' },
      { month: 'lipiec', target: '8x4' },
      { month: 'sierpień', target: '9x4' },
      { month: 'wrzesień', target: '10x4' },
      { month: 'październik', target: '11x4' },
      { month: 'listopad', target: '12x4' },
      { month: 'grudzień', target: '13x4' },
      { month: 'styczeń', target: '14x4' },
      { month: 'luty', target: '15x4' }
    ];

    let currentUser = null;
    let state = {
      activeTab: 'flow',
      selectedDiscipline: 'silownia',
      templates: DEFAULT_TEMPLATES,
      workout: [],
      history: [],
      monthlyPlan: DEFAULT_MONTHLY_PLAN
    };

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-email-display').textContent = `Zalogowany: ${user.email}`;
        loadUserData();
      } else {
        currentUser = null;
        document.getElementById('app-screen').classList.add('hidden');
        document.getElementById('auth-screen').classList.remove('hidden');
      }
    });

    function handleLogin() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      auth.signInWithEmailAndPassword(email, pass).catch(err => alert(err.message));
    }

    function handleRegister() {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;
      auth.createUserWithEmailAndPassword(email, pass).catch(err => alert(err.message));
    }

    function handleLogout() {
      auth.signOut();
    }

    async function loadUserData() {
      const docRef = db.collection('users').doc(currentUser.uid);
      const doc = await docRef.get();
      if (doc.exists) {
        const data = doc.data();
        state.templates = data.templates || DEFAULT_TEMPLATES;
        state.history = data.history || [];
      } else {
        await docRef.set({ templates: DEFAULT_TEMPLATES, history: [] });
      }
      selectDiscipline('silownia');
      renderMonthlyPlan();
    }

    async function saveUserData() {
      if (!currentUser) return;
      await db.collection('users').doc(currentUser.uid).set({
        templates: state.templates,
        history: state.history
      }, { merge: true });
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('bg-accent', 'text-white', 'shadow-md');
        el.classList.add('text-slate-400');
      });
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tabId}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-accent', 'text-white', 'shadow-md');
        activeBtn.classList.remove('text-slate-400');
      }
      if (tabId === 'plan') renderMonthlyPlan();
      if (tabId === 'history') renderHistory();
    }

    function renderDisciplineSelector() {
      const container = document.getElementById('discipline-selector');
      if (!container) return;
      container.innerHTML = DISCIPLINES.map(d => `
        <button onclick="selectDiscipline('${d.id}')" 
          class="p-2.5 rounded-xl border text-center transition font-semibold text-xs ${
            state.selectedDiscipline === d.id ? 'bg-accent/20 border-accent text-accentLight' : 'bg-appBg border-cardBorder text-slate-400'
          }">${d.name}</button>
      `).join('');
      const titleEl = document.getElementById('current-discipline-title');
      if (titleEl) {
        const disc = DISCIPLINES.find(d => d.id === state.selectedDiscipline);
        titleEl.textContent = disc ? disc.name : 'Trening';
      }
    }

    function selectDiscipline(id) {
      state.selectedDiscipline = id;
      state.workout = JSON.parse(JSON.stringify(state.templates[id] || []));
      renderDisciplineSelector();
      renderWorkout();
    }

    function renderWorkout() {
      const container = document.getElementById('workout-exercise-list');
      if (!container) return;
      container.innerHTML = state.workout.map((ex, exIdx) => `
        <div class="bg-cardBg p-4 rounded-2xl border border-cardBorder space-y-3">
          <h4 class="font-bold text-slate-100 text-sm">${ex.name}</h4>
          <div class="space-y-2">
            ${ex.sets.map((set, setIdx) => `
              <div class="flex items-center justify-between gap-2 bg-appBg/60 p-2 rounded-xl border border-cardBorder/40">
                <span class="text-xs text-slate-500">Seria ${setIdx + 1}</span>
                <span class="text-xs text-white font-bold">${set.reps || set.time} powt/min</span>
                <button onclick="toggleSet(${exIdx},${setIdx})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${set.done ? 'bg-accent text-white' : 'bg-slate-800 text-slate-400'}">
                  ${set.done ? 'OK' : 'Zrób'}
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function toggleSet(exIdx, setIdx) {
      state.workout[exIdx].sets[setIdx].done = !state.workout[exIdx].sets[setIdx].done;
      renderWorkout();
    }

    function renderMonthlyPlan() {
      const container = document.getElementById('monthly-plan-list');
      if (!container) return;
      container.innerHTML = DEFAULT_MONTHLY_PLAN.map(item => `
        <div class="bg-appBg p-3 px-4 rounded-xl border border-cardBorder flex items-center justify-between">
          <span class="text-xs font-bold text-slate-200">${item.month}</span>
          <span class="text-xs font-mono font-bold text-accentLight bg-accent/10 px-2.5 py-1 rounded-lg border border-accent/30">${item.target}</span>
        </div>
      `).join('');
    }

    function finishWorkout() {
      state.history.unshift({
        id: Date.now(),
        date: new Date().toLocaleDateString('pl-PL'),
        discipline: DISCIPLINES.find(d => d.id === state.selectedDiscipline).name
      });
      saveUserData();
      alert("Zapisano trening!");
      switchTab('history');
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      if (!container) return;
      container.innerHTML = state.history.map(item => `
        <div class="bg-appBg p-4 rounded-xl border border-cardBorder flex justify-between items-center">
          <span class="font-bold text-white text-xs">${item.discipline}</span>
          <span class="text-xs text-slate-400">${item.date}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
